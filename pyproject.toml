[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctgov-evidence"
version = "0.1.0"
description = "Turn ClinicalTrials.gov records into a structured, source-traced evidence summary."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
narrative = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
app = ["streamlit>=1.50"]
dev = ["pytest>=8", "ruff>=0.5", "anthropic>=0.40", "mcp>=1.2"]

[project.scripts]
ctgov-evidence = "ctgov_evidence.cli:main"
ctgov-evidence-mcp = "ctgov_evidence.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctgov_evidence"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
